name: Scala Steward

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "17"
      java-opts:
        required: false
        type: string
        default: ""
      sbt-runner-version:
        required: false
        type: string
        default: "2.0.9"
    secrets:
      # this needs to be a personal access token for a service account, as using the default GITHUB_TOKEN
      # doesn't trigger actions, when a PR is created (this is a known limitation of GitHub Actions, and
      # using a PAT is a documented work-around)
      github-token:
        required: true

jobs:
  scala-steward:
    runs-on: ubuntu-24.04
    env:
      JAVA_OPTS: ${{ inputs.java-opts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout central Scala Steward config
        uses: actions/checkout@v7
        with:
          repository: softwaremill/github-actions-workflows
          path: .steward-central
          sparse-checkout: default.scala-steward.conf
          sparse-checkout-cone-mode: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1, specifically v1.5.10
        with:
          sbt-runner-version: ${{ inputs.sbt-runner-version }}
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@5bbb0a3f32b42774f8ba1ed18c29db5d915d2200 # v2, specifically v2.80.0
        with:
          author-name: scala-steward
          author-email: scala-steward
          repo-config: .steward-central/default.scala-steward.conf
          ignore-opts-files: false
          github-token: ${{ secrets.github-token }}
