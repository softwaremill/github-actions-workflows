name: Label

on:
  workflow_call:

jobs:
  # the labels are attached as specified in `.github/labeler.yml`
  label:
    name: Attach labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Launch labeler
        uses: srvaroa/labeler@e8fbb2561481ef6e711a770f0234e9379dc76892 # master at the time of pinning
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
