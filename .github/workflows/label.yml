name: Label

on:
  workflow_call:

jobs:
  # the labels are attached as specified in `.github/labeler.yml`
  label:
    name: Attach labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Launch labeler
        uses: srvaroa/labeler@ab4c55c22867cb15d9653b053cd7563bffa2cb74 # master at the time of pinning
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
