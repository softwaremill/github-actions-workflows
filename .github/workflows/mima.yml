name: Mima

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "17"
      java-opts:
        required: false
        type: string
        default: ""
      sbt-runner-version:
        required: false
        type: string
        default: "2.0.9"

jobs:
  mima:
    runs-on: ubuntu-24.04
    env:
      JAVA_OPTS: ${{ inputs.java-opts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout tags so that dynver works properly (we need the version for MiMa)
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1, specifically v1.5.10
        with:
          sbt-runner-version: ${{ inputs.sbt-runner-version }}
      - name: Check MiMa # disable for major releases
        run: sbt -v mimaReportBinaryIssues