name: build

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "17"
      java-opts:
        required: false
        type: string
        default: ""
      sbt-runner-version:
        required: false
        type: string
        default: "2.0.9"
      sttp-native:
        required: false
        type: number
        default: 0
      install-libidn11:
        required: false
        type: boolean
        default: false
      install-libidn2:
        required: false
        type: boolean
        default: false
      compile-documentation:
        required: false
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      JAVA_OPTS: ${{ inputs.java-opts }}
      STTP_NATIVE: ${{inputs.sttp-native}}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{inputs.java-version}}
        cache: 'sbt'
    - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1, specifically v1.5.10
      with:
        sbt-runner-version: ${{ inputs.sbt-runner-version }}
    - name: Install libidn11-dev
      if: ${{ inputs.install-libidn11 }}
      run: sudo apt-get install libidn11-dev
    - name: Install libidn2-dev
      if: ${{ inputs.install-libidn2 }}
      run: |
        sudo apt-get update
        sudo apt-get install libidn2-dev
    - name: Check formatting
      run: sbt -v scalafmtCheckAll
    - name: Compile
      run: sbt -v compile
    - name: Compile documentation
      if: ${{ inputs.compile-documentation }}
      run: sbt -v compileDocumentation
    - name: Test
      # `testOnly *` runs all tests in both sbt 1 and 2, `testFull` breaks sbt 1 and `test` behavior was changed in sbt 2
      run: sbt -v "testOnly *"
    - uses: actions/upload-artifact@v5  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: 'tests-results-java-${{ inputs.java-version }}'
        path: '**/test-reports/TEST*.xml'
